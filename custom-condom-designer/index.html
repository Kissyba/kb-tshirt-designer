<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Condom Designer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f7f7;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .editor {
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      position: relative;
      padding: 20px;
      width: 100%;
      max-width: 800px;
      overflow: hidden;
    }

    .canvas {
      width: 100%;
      height: 400px;
      background: url('https://kissybangbang.com/wp-content/uploads/2020/03/white2.png') no-repeat center center;
      background-size: contain;
      border: 2px dashed #e91e63;
      border-radius: 10px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
    }

    .disclaimer {
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 15px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      background: #ffffff;
      color: #e91e63;
      margin: 0 5px;
      border-radius: 25px;
      border: 2px solid #e91e63;
      transition: all 0.3s ease;
    }

    .tab.active, .tab:hover {
      background: #e91e63;
      color: #ffffff;
    }

    .actions {
      text-align: center;
      margin-top: 25px;
    }

    .actions button {
      padding: 12px 25px;
      font-size: 15px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      outline: none;
    }

    .add-to-cart {
      background: #e91e63;
      color: #fff;
      margin-right: 10px;
    }

    .download-preview {
      background: #aaa;
      color: #fff;
      opacity: 0.8;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      z-index: 10;
      display: none;
    }

    .loading-overlay img {
      width: 60px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @media (max-width: 768px) {
      .canvas { height: 250px; }
      .tabs { flex-direction: column; }
      .tab { margin-bottom: 5px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎨 Create Your Custom Condom Wrapper</h1>

  <div class="editor">
    <div class="loading-overlay" id="loading">
      <img src="https://i.imgur.com/v6fXx3J.png" alt="Loading">
      <p id="loading-message">Preparing your cheeky wrapper... 😏</p>
    </div>

    <div class="canvas" id="canvas">
      <span style="color:#ccc;">Your design appears here</span>
    </div>

    <div class="disclaimer">⚠️ Keep your design within the dotted lines for optimal print quality!</div>

    <div class="tabs">
      <div class="tab active">Upload</div>
      <div class="tab">Text</div>
      <div class="tab">Clipart</div>
    </div>

    <div class="actions">
      <button class="add-to-cart">🛒 Add to Cart</button>
      <button class="download-preview">💾 Download Preview</button>
    </div>
  </div>
</div>

<script>
  const messages = [
    "Warming up your rubber... 🔥",
    "Preparing your cheeky wrapper... 😏",
    "Lubricating pixels... 💦",
    "Stretching canvas boundaries... 😜",
    "Ensuring maximum satisfaction... 😉"
  ];

  let msgIndex = 0;
  const loadingMessage = document.getElementById('loading-message');

  function rotateMessage() {
    msgIndex = (msgIndex + 1) % messages.length;
    loadingMessage.textContent = messages[msgIndex];
  }

  setInterval(rotateMessage, 3000);

  const loadingOverlay = document.getElementById('loading');
  loadingOverlay.style.display = 'flex';

  setTimeout(() => {
    loadingOverlay.style.display = 'none';
  }, 2500);
</script>

</body>
</html>
